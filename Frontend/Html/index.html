<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evangadi Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Poppins", Arial, sans-serif;
    background: #000;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 130px;
    padding: 0 30px 0 0;
    background: radial-gradient(ellipse at 70% 100%, #1d1d1d 0%, #000 60%);
    color: #fff;
  }

  /* ---------- Logo ---------- */
  .logo {
    display: flex;
    align-items: center;
    height: 50px;
    font-size: 58px;
    font-weight: 500;
    letter-spacing: -1px;
    line-height: 1;
    color: #fff;
    text-decoration: none;
  }
  /* The "E" drawn with three bars */
  .logo .e {
    display: inline-flex;
    flex-direction: column;
    justify-content: space-between;
    width: 42px;
    height: 36px;
    margin-right: 4px;
  }
  .logo .e i { display: block; height: 6px; background: #fff; }
  .logo .accent { color: #f7931e; }

  /* ---------- Navigation ---------- */
  .nav {
    display: flex;
    align-items: center;
    gap: 60px;
    margin-left: auto;
    margin-right: 60px;
  }
  .nav a {
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    font-weight: 500;
    transition: color .2s;
  }
  .nav a:hover,
  .nav a:focus-visible { color: #f7931e; outline: none; }

  .cart { display: flex; }
  .cart svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 1.5; }

  /* ---------- Sign in button ---------- */
  .sign-in {
    padding: 14px 48px;
    border-radius: 999px;
    background: #fff;
    color: #000;
    font-size: 18px;
    font-weight: 500;
    text-decoration: none;
    transition: background .2s;
  }
  .sign-in:hover { background: #f7931e; }

  /* ---------- Mobile ---------- */
  @media (max-width: 9000px) {
    .header { height: auto; padding: 16px; flex-wrap: wrap; gap: 16px; }
    .logo { font-size: 40px; }
    .nav { order: 3; width: 100%; gap: 20px; margin: 0; flex-wrap: wrap; }
    .sign-in { margin-left: auto; padding: 10px 28px; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="#" class="logo" aria-label="Evangadi home">
    <span class="e"><i></i><i></i><i></i></span>
    <span class="accent">V&Lambda;</span>NG&Lambda;DI
  </a>

  <nav class="nav">
    <a href="#">Home</a>
    <a href="#">Learn &amp; Grow</a>
    <a href="#">Tutoring</a>
    <a href="#">Our Team</a>
    <a href="#">Contact</a>
    <a href="#" class="cart" aria-label="Cart">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h3l2.5 12h11L21 7H6"/>
        <circle cx="9" cy="20" r="1.3"/>
        <circle cx="17" cy="20" r="1.3"/>
      </svg>
    </a>
  </nav>

  <a href="#" class="sign-in">Sign In</a>
</header>

</body>
</html>
